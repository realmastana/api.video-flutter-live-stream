name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze_and_test:
    name: Analyze, test and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test
      - name: Publish dry run
        run: flutter pub publish --dry-run
