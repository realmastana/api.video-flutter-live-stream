name: Publish to pub.dev

# Publishes a new version to pub.dev whenever the version in pubspec.yaml
# changes on main (the k-paxian action skips the publish if the version is
# unchanged). Requires two repository secrets:
#
#   PUB_PUBLISH_ACCESS_TOKEN
#   PUB_PUBLISH_REFRESH_TOKEN
#
# Both come from the `pub-credentials.json` file created by `flutter pub
# publish` (or `dart pub token add https://pub.dev`) on your machine —
# usually at `~/.config/dart/pub-credentials.json` (Linux) or
# `~/Library/Application Support/dart/pub-credentials.json` (macOS).
# Copy the `accessToken` and `refreshToken` fields into the secrets above.
#
# You can also trigger it manually from the Actions tab (workflow_dispatch).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Publish
        uses: k-paxian/dart-package-publisher@master
        with:
          accessToken: ${{ secrets.PUB_PUBLISH_ACCESS_TOKEN }}
          refreshToken: ${{ secrets.PUB_PUBLISH_REFRESH_TOKEN }}
          skipTests: true
